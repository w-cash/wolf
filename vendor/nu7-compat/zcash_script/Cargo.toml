[features]
default = [
    "std",
    "signature-validation",
]
descriptor = [
    "dep:bip32",
    "dep:hex",
    "dep:secp256k1",
]
signature-validation = ["dep:secp256k1"]
std = []
test-dependencies = [
    "dep:hex",
    "dep:lazy_static",
    "hex/std",
]

[lib]
name = "zcash_script"
path = "src/lib.rs"

[dependencies.bip32]
path = "../bip32"
version = "0.6"
features = [
    "alloc",
    "secp256k1-ffi",
]
optional = true
default-features = false

[dependencies.bitflags]
version = "2.8"

[dependencies.bounded-vec]
version = "0.9"

[dependencies.hex]
version = ">= 0.4.3"
optional = true
default-features = false

[dependencies.lazy_static]
version = "1.5"
optional = true

[dependencies.ripemd]
version = "0.1"
default-features = false

[dependencies.secp256k1]
version = "0.33"
features = ["alloc"]
optional = true
default-features = false

[dependencies.sha1]
version = "0.10"
default-features = false

[dependencies.sha2]
version = "0.10"
default-features = false

[dependencies.thiserror]
version = "2"
default-features = false

[dev-dependencies.hex]
version = ">= 0.4.3"
features = ["std"]
default-features = false

[dev-dependencies.lazy_static]
version = "1.5"

[target."cfg(linux)".dev-dependencies.libfuzzer-sys]
version = "0.4"
