# CI-only Wcash Testnet profile for the native merged-mining smoke test.
# It deliberately has no peers and no debug sync override. Zebra's normal
# test-network policy still permits an isolated node to issue templates. The
# debug mempool override and unauthenticated loopback endpoints are strictly for
# the local spend E2E; do not copy this profile into pool operations.

[network]
network = "WcashTestnet"
listen_addr = "127.0.0.1:38233"
initial_mainnet_peers = []
initial_testnet_peers = []
cache_dir = false
peerset_initial_target_size = 1
max_connections_per_ip = 1

[state]
ephemeral = true

[rpc]
listen_addr = "127.0.0.1:38232"
lightwalletd_listen_addr = "127.0.0.1:38234"
enable_cookie_auth = false

[mempool]
debug_enable_at_height = 0

[mining]
extra_coinbase_data = "WcashTestnetCI"
internal_miner = false

[tracing]
filter = "info"
