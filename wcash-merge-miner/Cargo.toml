[package]
name = "wcash-merge-miner"
version = "0.1.0"
publish = false
authors.workspace = true
description = "Local Zcash Equihash merged-mining harness for Wcash"
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
equihash = { version = "0.3", features = ["solver"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wcash-zcash-aux = { path = "../wcash-zcash-aux" }
zebra-chain = { path = "../zebra-chain", version = "12.0.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
