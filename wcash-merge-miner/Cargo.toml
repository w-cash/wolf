[package]
name = "wcash-merge-miner"
version = "0.1.0"
publish = false
authors.workspace = true
description = "Local Zcash Equihash merged-mining harness for Wcash"
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version = "1.89"

[features]
# Isolated Regtest-only funding-policy fixture; never publish these binaries.
wcash-funding-test-fixture = ["zebra-chain/wcash-funding-test-fixture"]

[dependencies]
argon2 = "0.5"
blake2b_simd.workspace = true
equihash = { version = "0.3", features = ["solver"] }
fs2 = "0.4"
hex = "0.4"
nix = { workspace = true, features = ["socket", "user"] }
orchard.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
wcash-pool-protocol = { git = "https://github.com/w-cash/pool.git", rev = "2925597d1af8b7b9c7edfc67c0d822a15ffd01f3" }
wcash-zcash-aux = { path = "../wcash-zcash-aux" }
wcash-zec-parent = { path = "../wcash-zec-parent" }
zcash_address.workspace = true
zcash_note_encryption.workspace = true
zcash_protocol.workspace = true
zebra-chain = { path = "../zebra-chain", version = "12.0.0" }
zeroize = "1.8"

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
wcash-zec-parent = { path = "../wcash-zec-parent", features = ["test-helpers"] }
tempfile.workspace = true
zebra-chain = { path = "../zebra-chain", version = "12.0.0", features = [
  "proptest-impl",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
