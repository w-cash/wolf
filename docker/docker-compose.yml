services:
  wcash:
    container_name: wcash
    image: wcash-node:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "4"
          memory: 16G
    env_file:
      - .env
    volumes:
      - wcash-cache:/home/zebra/.cache/wcash
    # Having `tty` set to true makes Wcash use colored logs.
    tty: true
    # This file supplies the base configuration. WCASH_* values from `.env`
    # override it. Remove this mapping to run entirely from defaults and `.env`.
    configs:
      - source: wcash-config
        target: /home/zebra/.config/wcash.toml

    # P2P port for inbound peer connections (recommended).
    ports:
      - "127.0.0.1:28233:28233" # local P2P on Wcash Regtest

    # Uncomment any of these to expose additional services:
    #   - "28232:28232" # RPC endpoint on Wcash Regtest
    #   - "9999:9999"   # Metrics
    #   - "3000:3000"   # Tracing
    #   - "8080:8080"   # Health endpoints (/healthy, /ready)

configs:
  wcash-config:
    #! To customize the default configuration, edit this file before starting
    #! the container.
    file: ./default-wcash-config.toml

volumes:
  wcash-cache:
    driver: local
