# Loopback-only Wcash regtest child node for native merged-mining tests.
# Build `zebrad` with the `wcash-consensus` feature for this profile.

[network]
network = "WcashRegtest"
listen_addr = "127.0.0.1:28233"
initial_mainnet_peers = []
initial_testnet_peers = []
cache_dir = false
peerset_initial_target_size = 1
max_connections_per_ip = 1

[state]
ephemeral = true

[rpc]
listen_addr = "127.0.0.1:28232"
enable_cookie_auth = false
# Isolated regtest has no public peers. Never use this bypass publicly.
debug_force_finished_sync = true

[mining]
# `createauxblock` requires and validates an operator-owned Wcash address on
# each request. A transparent `WR...` address is the normal pool path; a
# `wuregtest1...` Unified Address opts into a private Ironwood reward.
extra_coinbase_data = "Wcash"
internal_miner = false

[tracing]
filter = "info"
