# Loopback-only Wcash regtest profile. Never use this file for a public node.

[network]
network = "WcashRegtest"
listen_addr = "127.0.0.1:28233"
initial_mainnet_peers = []
initial_testnet_peers = []
cache_dir = false
peerset_initial_target_size = 1
max_connections_per_ip = 1

[state]
ephemeral = true

[rpc]
listen_addr = "127.0.0.1:28232"
enable_cookie_auth = false
# Isolated regtest has no public peers. This bypass is unsafe on public networks.
debug_force_finished_sync = true

[mining]
# Public transparent regtest fixture only. Replace it with an address whose
# keys you control. Use a Wcash Unified Address with an Orchard receiver only
# when explicitly testing private Ironwood rewards.
miner_address = "WR64VqQpZRujxYnAJmqGK4d4fbqQZRZHazG"
extra_coinbase_data = "Wcash"
internal_miner = true

[tracing]
filter = "info"
