[package]
name = "wcash-zcash-aux"
version = "0.1.0"
publish = false
authors.workspace = true
description = "Strict Zcash Equihash AuxPoW primitives for Wcash"
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version = "1.89"

[features]
default = ["zebra"]
zebra = ["dep:zebra-chain", "dep:wcash-zec-parent"]

[dependencies]
blake2b_simd = { workspace = true }
equihash = "0.3"
sha2 = "0.10"
zebra-chain = { path = "../zebra-chain", version = "12.0.0", optional = true }
wcash-zec-parent = { workspace = true, optional = true }

[dev-dependencies]
hex = "0.4"
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
