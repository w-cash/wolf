# Loopback-only Zcash regtest template node for Wcash integration tests.
# Build `zebrad` without the `wcash-consensus` feature for this profile.

[network]
network = "Regtest"
listen_addr = "127.0.0.1:18233"
initial_mainnet_peers = []
initial_testnet_peers = []
cache_dir = false
peerset_initial_target_size = 1
max_connections_per_ip = 1

[network.testnet_parameters.activation_heights]
# The AuxPoW carrier authenticates ZIP-244 authorization data, so local parent
# integration tests must use the same v6/NU6.3 transaction format as production.
"NU6.3" = 1

[state]
ephemeral = true

[rpc]
listen_addr = "127.0.0.1:18232"
enable_cookie_auth = false
# Isolated regtest has no public peers. Never use this bypass publicly.
debug_force_finished_sync = true

[mining]
# Must exactly equal ZCASH_PAYOUT_ADDRESS. This public regtest fixture is not a
# spendable operator payout address.
miner_address = "tmJymvcUCn1ctbghvTJpXBwHiMEB8P6wxNV"
extra_coinbase_data = "WcashParent"

[tracing]
filter = "info"
