name: Wcash Release Gate

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  auxpow-validation:
    name: AuxPoW, coordinator, and isolated profiles
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
          cache-key: wcash-release-gate
          cache-on-failure: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-zebra-build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test strict AuxPoW codecs in both dependency profiles
        run: |
          cargo test --locked -p wcash-zcash-aux
          cargo test --locked -p wcash-zcash-aux --no-default-features
          cargo clippy --locked -p wcash-zcash-aux --all-targets -- -D warnings
          cargo clippy --locked -p wcash-zcash-aux --no-default-features --all-targets -- -D warnings

      - name: Test transaction-domain integration across workspace boundaries
        run: |
          cargo test --locked -p zebra-chain --lib --features wcash-consensus wcash_testnet_has_frozen_isolated_network_identity
          cargo test --locked -p zebra-consensus --lib --features wcash-consensus wcash_requires_v6_and_exact_branch_domain
          cargo test --locked -p zebra-rpc --lib --features zebra-chain/wcash-consensus wcash_get_blockchain_info_reports_custom_transaction_domain
          cargo test --locked -p wcash-wallet --lib wcash_launch_parameters_expose_cumulative_shielded_activations
          cargo test --locked -p wcash-wallet --test transaction_domain wcash_builder_rejects_standard_nu6_3_branch
          cargo test --locked -p wcash-wallet --test transaction_domain wcash_pczt_creator_preserves_v6_custom_branch

      - name: Test and lint the native coordinator
        run: |
          cargo test --locked -p wcash-merge-miner
          cargo clippy --locked -p wcash-merge-miner --all-targets -- -D warnings

      - name: Test and lint Wcash wallet boundaries
        run: |
          cargo test --locked -p wcash-wallet
          cargo clippy --locked -p wcash-wallet --all-targets -- -D warnings

      - name: Test Wcash consensus-specific paths
        run: |
          cargo test --locked -p zebra-chain --lib --features wcash-consensus
          cargo test --locked -p zebra-consensus --lib --features wcash-consensus wcash
          cargo test --locked -p zebra-consensus --lib --features wcash-consensus wcash_requires_v6_and_exact_branch_domain
          cargo test --locked -p zebra-consensus --lib --features wcash-consensus wcash_v6_transfer_passes_block_and_mempool_verifiers
          cargo test --locked -p zebra-consensus --lib --features wcash-consensus wcash_v6_out_of_range_expiry_is_rejected_by_block_and_mempool_verifiers
          cargo test --locked -p zebra-rpc --lib wcash
          cargo test --locked -p zebra-rpc --lib --features zebra-chain/wcash-consensus wcash
          cargo test --locked -p zebra-rpc --lib --features zebra-chain/wcash-consensus all_network_templates_query_and_propagate_mempool_errors
          cargo test --locked -p zebra-rpc --lib --features zebra-chain/wcash-consensus wcash_template_includes_v6_transfer_fees_and_private_coinbase

      - name: Test parent RPC payout attestation and serialization
        run: |
          cargo test --locked -p zebra-rpc --lib parent_payout_attestation_is_canonical_and_redacted
          cargo test --locked -p zebra-rpc --test serialization_tests test_get_block_template_wcash_aux_request

      - name: Test state and consensus-profile boundaries
        run: |
          cargo test --locked -p zebra-state --lib populated_read_state_responds_correctly
          cargo test --locked -p zebra-network --lib default_config_uses_ipv6
          cargo test --locked -p zebra-network --lib --features wcash-consensus default_config_uses_ipv6
          cargo test --locked -p zebrad --lib start_rejects_wcash_networks
          cargo test --locked -p zebrad --lib --features wcash-consensus start_rejects_inherited_zcash_networks
          cargo test --locked -p zebrad --lib start_accepts_default_network_for_selected_consensus
          cargo test --locked -p zebrad --lib --features wcash-consensus start_accepts_default_network_for_selected_consensus
          cargo test --locked -p zebrad --lib user_agent_matches_the_selected_consensus_profile
          cargo test --locked -p zebrad --lib --features wcash-consensus user_agent_matches_the_selected_consensus_profile

      - name: Test frozen Wcash Testnet identity and isolation
        run: |
          cargo test --locked -p wcash-genesis public_testnet
          cargo test --locked -p zebra-chain --lib --features wcash-consensus wcash_testnet
          cargo test --locked -p zebra-network --lib --features wcash-consensus wcash_
          cargo test --locked -p zebra-state --lib --features zebra-chain/wcash-consensus wcash_height_one_uses_candidate_height
          cargo test --locked -p zebra-state --lib --features zebra-chain/wcash-consensus zcash_activation_boundary_uses_candidate_height
          cargo test --locked -p zebrad --lib --features wcash-consensus local_genesis_bootstrap_selects_exact_built_in_chain
          cargo test --locked -p zebrad --lib --features wcash-consensus start_accepts_both_built_in_wcash_networks

      - name: Compile the complete Wcash node graph
        run: cargo check --locked --release -p zebrad --bin zebrad --no-default-features --features wcash-consensus

      - name: Compile the documented Wcash coordinator graph
        run: cargo check --locked --release -p zebrad --bin zebrad --features wcash-consensus,internal-miner

      - name: Compile the unmodified Zcash profile separately
        run: cargo check --locked --release -p zebrad --bin zebrad --no-default-features

      - name: Preserve standard Zcash branch, history, privacy, and RPC behavior
        run: |
          cargo test --locked -p zebra-chain --lib branch_id
          cargo test --locked -p zebra-chain --lib history
          cargo test --locked -p zebra-chain --lib zip244
          cargo test --locked -p zebra-consensus --lib coinbase_outputs_are_decryptable
          cargo test --locked -p zebra-rpc --lib get_blockchain_info

      - name: Preserve upstream Zcash parser and verifier boundaries
        run: |
          cargo test --locked -p zebra-chain --lib coinbase_script_len_bounds_enforced_at_parse
          cargo test --locked -p zebra-chain --lib expiry_height_preserves_out_of_range_values
          cargo test --locked -p zebra-consensus --lib out_of_range_expiry_height
          cargo test --locked -p zebra-consensus --lib small_order
          cargo test --locked -p zebra-consensus --lib tx_with_pre_activation_branch_id_is_rejected
          cargo test --locked -p zebra-consensus --lib null_prevout_hash_with_other_index_is_not_coinbase
          cargo test --locked -p zebra-consensus --lib non_coinbase_expiry_height_accepts_zero_and_spec_max

      # GitHub Actions must not execute proof-of-work solving. The native
      # end-to-end scripts remain mandatory local release checks; hosted CI
      # validates fixed Equihash proofs and every non-solving integration path.
      - name: Verify fixed Equihash and AuxPoW vectors without solving work
        run: |
          cargo test --locked -p wcash-zcash-aux upstream_zcash_genesis_header_and_work_vector
          cargo test --locked -p wcash-zcash-aux raw_byte_order_interoperability_vector
          cargo test --locked -p wcash-zcash-aux proof_round_trips_and_all_checks_complete
          cargo test --locked -p wcash-merge-miner persisted_wcash_winner_requires_consensus_valid_auxpow
          cargo test --locked -p wcash-merge-miner persisted_zcash_winner_requires_target_and_equihash
          cargo test --locked -p zebra-consensus --lib --features wcash-consensus wcash_auxpow_header_and_placeholder_rules
