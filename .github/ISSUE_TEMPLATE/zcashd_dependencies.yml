---
name: "Upgrade zcashd dependencies"
description: "Specific steps for upgrading dependencies shared with zcashd. Wolf maintainers only."
title: 'Upgrade dependencies for zcashd (version)'
type: Task
body:
  - type: markdown
    attributes:
      value: |
        ## Motivation
        
        `zcashd` crate dependency upgrades need to be done together, along with an upgrade to `zcash_script`.
        The inherited draft procedure is in [ZcashFoundation/zebra#6532](https://github.com/ZcashFoundation/zebra/issues/6532); verify every step against this fork before use.
        
        The upgrade steps are:
        - [ ] upgrade and release `zcash_script`
        - [ ] upgrade Wolf's ECC and `zcash_script` dependencies in the same PR
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        What versions of `zcashd` and the ECC crates do we need to upgrade to? 
    validations:
      required: true
  - type: textarea
    id: complexity
    attributes:
      label: Complex Code or Requirements
      description: |
        Does this PR change unsafe code or complex consensus rules?
        If it does, explain how we will implement, review, and test it.
    validations:
      required: false
  - type: textarea
    id: tests
    attributes:
      label: Testing
      description: |
        How can we check that this change does what we want it to do?
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related Work
      description: |
        Is this change related to other features or tickets?
    validations:
      required: false
