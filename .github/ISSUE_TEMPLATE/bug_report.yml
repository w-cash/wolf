name: '🐛 Bug report'
description: Create a report to help us improve
title: 'bug: '
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug in Wcash Wolf!

        Please fill out the sections below to help us reproduce and fix the bug.
        Do not disclose security-sensitive details here; use the private process in [SECURITY.md](https://github.com/w-cash/wolf/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      value: '
        I expected to see this happen:


        Instead, this happened:
        '
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What were you doing when the issue happened?
      description: Copy and paste the exact commands or code here.
      placeholder: 'Behavior or code sample that causes the bug'
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Wolf node logs
      description: Paste only the relevant redacted log lines. Never include RPC cookies, wallet seeds, keys, tokens, or private payout data.
      placeholder: 'Copy and paste the logs here'
    validations:
      required: false
  - type: input
    id: zebrad-version
    attributes:
      label: Wolf revision and node version
      description: 'Include the Wolf commit, build features, selected network, and output of `zebrad --version`.'
      placeholder: 'zebrad 1.0.0-placeholder'
    validations:
      required: false
  - type: checkboxes
    id: os
    attributes:
      label: Which operating systems does the issue happen on?
      description: You may select more than one.
      options:
        - label: Linux
        - label: macOS
        - label: Windows
        - label: Other OS
  - type: input
    id: os-details
    attributes:
      label: OS details
      description: 'Linux, macOS, BSD: the output of `uname -a`; Windows: version and 32-bit or 64-bit; Other OS: name and version'
    validations:
      required: false
  - type: textarea
    id: anything-else
    attributes:
      label: Additional information
      description: Is there anything else that could help us solve this issue?
    validations:
      required: false
