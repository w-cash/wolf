---
name: "🚧 Change request"
description: Suggest a feature or change for this project
title: 'feature: '
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest a feature or change for Wcash Wolf!

        Please fill out the sections below to help us understand your request.
        Consensus, network, genesis, monetary-policy, privacy, and mining changes require explicit Wcash maintainer coordination before implementation.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        Is your feature request related to a problem?
        How does this change improve Wcash Wolf?
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Specifications
      description: |
        Link the exact Wcash implementation or guide being changed. If inherited Zcash, ZIP, or Bitcoin behavior is relevant, identify what Wcash preserves and what it changes.
    validations:
      required: false
  - type: textarea
    id: complexity
    attributes:
      label: Complex Code or Requirements
      description: |
        Does this PR change concurrency, unsafe code, or complex consensus rules?
        If it does, explain how we will implement, review, and test it.
    validations:
      required: false
  - type: textarea
    id: tests
    attributes:
      label: Testing
      description: |
        How can we check that this change does what we want it to do?
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related Work
      description: |
        Is this change related to other features or tickets?
    validations:
      required: false
